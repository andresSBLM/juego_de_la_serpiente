<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de la serpiente con javascript</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main id="principal">

    </main>
    <div id="div_contador"><p id="contador"></p></div>
    <footer id="pie">
        <a id="pausar">Pausar</a>
        <a id="reiniciar" href="index.html">Reiniciar</a>
    </footer>
    <script>
        const MAIN = document.getElementById("principal");
        const CONTADOR = document.getElementById("contador");
        const PAUSAR = document.getElementById("pausar");
        PAUSAR.classList.add("activo");
        var estado = "activo";
        const VELOCIDAD = 100;
        const texto = '*';
        const prota = "0";
        const MANZANA = "X";
        var pantalla = [];
        const FILAS = 20;
        const ANCHO = 20;
        const POSICION_INICIO = 18;
        const ARRAY_INICIO = 10;
        var posicion = POSICION_INICIO;
        var turno = 0;
        var direccion = 'norte';
        var posicion_array_actual = ARRAY_INICIO - 1;
        var contador_manzanas = 0;
        const CANTIDAD_MANZANAS = 50;
        var columna_random;
        var posicion_random;
        var serpiente = [];
        var posicion_inicial = [posicion_array_actual, posicion];
        serpiente.push(posicion_inicial);
        console.log(serpiente);

        function pantalla_nueva() {
            console.log("Reconstruccion completa de pantalla")
            for (let y = 0; y < FILAS; y++) {
                var fila = [];
                for (let x = 1; x <= ANCHO; x++) {
                    fila.push(texto);
                } 
                pantalla.push(fila);
            }  
        }
        pantalla_nueva();



        function cargar() {
            if (turno == 0) {
                pantalla[posicion_array_actual].splice(posicion, 1, prota);
                console.log("Inicio marcado en : " + posicion_array_actual +  " " + posicion);
                turno++;
            }
            MAIN.innerHTML = '';
            for (let fila = 0; fila < pantalla.length; fila++) {
                const CONTENEDOR = document.createElement("div");
                for (let x = 0; x < ANCHO; x++) {
                    const P = document.createElement("p");
                    P.textContent = pantalla[fila][x];
                    if (P.textContent == "*") {
                        P.classList.add("texto_normal");
                    } else if (P.textContent == "0") {
                        P.classList.add("serpiente");
                    } else {
                        P.classList.add("manzana");
                    }
                    CONTENEDOR.appendChild(P);
                }    
                MAIN.appendChild(CONTENEDOR);
            }
            turno++;
        }

        cargar();

        function generar_manzanas(cantidad) {
            CONTADOR.textContent = contador_manzanas;
            for (let x = 0; x < cantidad; x++) {
                columna_random = ((Math.random()) * (FILAS - 2)).toFixed();
                posicion_random = ((Math.random()) * (ANCHO - 2)).toFixed();
                const PANTALLA_RANDOM = pantalla[columna_random][posicion_random];
                if (PANTALLA_RANDOM == prota || PANTALLA_RANDOM == MANZANA) {
                    generar_manzanas(1);
                } else {
                    console.log("Manzana generada en Fila:" + columna_random + " Posicion: " + posicion_random);
                    pantalla[columna_random].splice(posicion_random, 1, MANZANA);  
                }
            }
        }

        generar_manzanas(CANTIDAD_MANZANAS);

        function aumantar_tamaño() {
            const ULTIMO_ELEMENTO = serpiente[serpiente.length - 1];
                pantalla[ULTIMO_ELEMENTO[0]].splice(ULTIMO_ELEMENTO[1], 1, prota);
                console.log("Elemento generado en: " + ULTIMO_ELEMENTO[0] + " " + (ULTIMO_ELEMENTO[1]));
                var nuevo_elemento = [ULTIMO_ELEMENTO[0], ULTIMO_ELEMENTO[1]];
                serpiente.push(nuevo_elemento);
                console.log("La nueva serpiente es: " + serpiente);    
            }
        

        function terminar_juego(err) {
            alert("Has perdido por: " + err);
            turno = 0;
            direccion = 'norte';
            posicion = POSICION_INICIO;
            posicion_array_actual = ARRAY_INICIO - 1;
            pantalla[columna_random].splice(posicion_random, 1 , texto);
            contador_manzanas = 0;
            posicion_inicial = [posicion_array_actual, posicion]
            serpiente = [posicion_inicial];
            pantalla = [];
            pantalla_nueva();
            generar_manzanas(CANTIDAD_MANZANAS);
        }

        function mover() {

            if (estado == "pausado") {
                return;
            }
            console.log("////////SE COMPLETO UN CICLO////////");
            console.log("Fila: "+posicion_array_actual + " Altura: " + posicion + ` ${direccion}`);
            const ARRAY_ACTUAL = pantalla[posicion_array_actual];
            var ultimo_array = serpiente[serpiente.length - 1];
            var nuevo_array;
            turno++;
            cargar();
            ultimo_array = serpiente[serpiente.length - 1];
            pantalla[ultimo_array[0]].splice(ultimo_array[1], 1, texto);
            switch (direccion) {


                case 'norte':
                    var nueva_posicion = posicion - 1;
                    console.log("Posicion :" + posicion + " " + nueva_posicion)
                    if (ARRAY_ACTUAL[nueva_posicion] == MANZANA ) {
                        generar_manzanas(1);
                        contador_manzanas++;
                        CONTADOR.textContent = contador_manzanas;
                        aumantar_tamaño();
                    }
                    if (ARRAY_ACTUAL[nueva_posicion] == prota) {
                        terminar_juego("Chocaste de frente contigo mismo");
                        break;
                    }
                    if (nueva_posicion > -1) {
                        ARRAY_ACTUAL[nueva_posicion] = prota;
                        const NUEVO_ARRAY = [posicion_array_actual, nueva_posicion];
                        serpiente.unshift(NUEVO_ARRAY);
                        serpiente.pop();
                        posicion--;
                        console.log("Primer elemento " + serpiente[0]);
                        console.log("Ultimo elemento: " + ultimo_array);
                        cargar(); 
                    } else {
                        terminar_juego("Te saliste del cuadrado por el norte");
                    }
                    break;


                case 'sur':
                    var nueva_posicion = posicion + 1;
                    console.log("Posicion :" + posicion + " " + nueva_posicion)
                    if (ARRAY_ACTUAL[nueva_posicion] == MANZANA ) {
                        generar_manzanas(1);
                        contador_manzanas++;
                        CONTADOR.textContent = contador_manzanas;
                        aumantar_tamaño();
                    }
                    if (ARRAY_ACTUAL[nueva_posicion] == prota) {
                        terminar_juego("Chocaste contigo mismo por debajo");
                        break;
                    }
                    if (nueva_posicion < ANCHO) {
                        ARRAY_ACTUAL[nueva_posicion] = prota;
                        const NUEVO_ARRAY = [posicion_array_actual, nueva_posicion];
                        serpiente.unshift(NUEVO_ARRAY);
                        serpiente.pop();
                        posicion++;
                        console.log("Primer elemento " + serpiente[0]);
                        console.log("Ultimo elemento: " + ultimo_array);
                        cargar(); 
                    } else {
                        terminar_juego("Te saliste del limite por el sur");
                    }
                    break;


                case 'este':
                    pos_nuevo_array = posicion_array_actual - 1;
                    if (pos_nuevo_array < 0) {
                        terminar_juego("Te chocaste contra la pared izquierda."); 
                        break;
                    }
                    if(pantalla[pos_nuevo_array][posicion] == MANZANA ) {
                        generar_manzanas(1);
                        contador_manzanas++;
                        CONTADOR.textContent = contador_manzanas;
                        aumantar_tamaño();
                    }
                    if (pantalla[pos_nuevo_array][posicion] == prota) {
                        terminar_juego("Chocaste de lado contigo mismo");
                        break;
                    }
                    pantalla[pos_nuevo_array][posicion] = prota;
                    const NUEVO_ARRAY = [pos_nuevo_array, posicion];
                    serpiente.unshift(NUEVO_ARRAY);
                    serpiente.pop();
                    posicion_array_actual--;
                    console.log("Primer elemento " + serpiente[0]);
                    console.log("Ultimo elemento: " + ultimo_array);
                    cargar();
                    break;


                case 'oeste':
                    pos_nuevo_array = posicion_array_actual + 1;
                    if (pos_nuevo_array > FILAS - 1) {
                        terminar_juego(); 
                        break;
                    }
                    if(pantalla[pos_nuevo_array][posicion] == MANZANA ) {
                        generar_manzanas(1);
                        contador_manzanas++;
                        CONTADOR.textContent = contador_manzanas;
                        aumantar_tamaño();
                    }
                    if (pantalla[pos_nuevo_array][posicion] == prota) {
                        terminar_juego("Chocaste de lado contigo mismo");
                        break;
                    }
                    pantalla[pos_nuevo_array][posicion] = prota;
                    const NUEVO_ARRAY_OESTE = [pos_nuevo_array, posicion];
                    serpiente.unshift(NUEVO_ARRAY_OESTE);
                    serpiente.pop();
                    posicion_array_actual++;
                    console.log("Primer elemento " + serpiente[0]);
                    console.log("Ultimo elemento: " + ultimo_array);
                    cargar();
                    break;
            }
        }

        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    direccion = 'norte';
                    break;
                case 'ArrowDown':
                    direccion = 'sur';
                    break;
                case 'ArrowLeft':
                    direccion = 'este';
                    break;
                case 'ArrowRight':
                    direccion = 'oeste';
                    break;
            }
        });

        

        setInterval(mover, VELOCIDAD);
        
        PAUSAR.addEventListener('click', () => {
            estado = (estado == "pausado")? "activo":"pausado";
            if (estado == "pausado") {
                PAUSAR.classList.remove("activo");
                PAUSAR.classList.add("pausado");
            } else {
                PAUSAR.classList.remove("pausado");
                PAUSAR.classList.add("activo");
            }
        })


        




    </script>
</body>

</html>
