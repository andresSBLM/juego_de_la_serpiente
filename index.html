<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de la serpiente con javascript</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main id="principal">

    </main>
    <div id="contador"></div>
    <script>
        const MAIN = document.getElementById("principal");
        const CONTADOR = document.getElementById("contador");
        const texto = '*';
        const prota = "0";
        const MANZANA = "X";
        var pantalla = [];
        const FILAS = 20;
        const ANCHO = 20;
        const POSICION_INICIO = 18;
        const ARRAY_INICIO = 10;
        var posicion = POSICION_INICIO;
        var turno = 0;
        var direccion = 'norte';
        var posicion_array_actual = ARRAY_INICIO - 1;
        var contador_manzanas = 0;


        if (pantalla.length == 0) {
            for (let y = 0; y < FILAS; y++) {
                var array = [];
                for (let x = 1; x <= ANCHO; x++) {
                    array.push(texto);
                } 
                const P = document.createElement("p");
                pantalla.push(array);
                P.textContent = pantalla[y].join(" ");
                MAIN.appendChild(P);
            }
        }

        

        function cargar(array) {
            if (turno == 0) {
                console.log(posicion_array_actual);
                const INICIO = array[posicion_array_actual];
                INICIO.splice(posicion, 1, prota);
                array[posicion_array_actual] = INICIO;
            }
            MAIN.innerHTML = '';
            for (let fila of pantalla) {
                const P = document.createElement("p");
                P.textContent = fila.join(" ");
                MAIN.appendChild(P);
            }
            console.log("Carga correcta");
            turno++;
        }

        function generar_manzana() {
            const COLUMNA_RANDOM = ((Math.random()) * (FILAS - 2)).toFixed();
            const POSICION_RANDOM = ((Math.random()) * (ANCHO - 2)).toFixed();
            console.log("fila random " + COLUMNA_RANDOM);
            pantalla[COLUMNA_RANDOM].splice(POSICION_RANDOM, 1, MANZANA);  
            CONTADOR.textContent = contador_manzanas;
            contador_manzanas++;

        }

        generar_manzana();
        

        function terminar_juego() {
            alert("Has perdido");
            turno = 0;
            direccion = 'norte';
            posicion = POSICION_INICIO;
            posicion_array_actual = ARRAY_INICIO - 1;
            cargar(pantalla);
        }

        function mover() {
            console.log("Fila: "+posicion_array_actual + " Altura: " + posicion + ` ${direccion}`);
            const ARRAY_ACTUAL = pantalla[posicion_array_actual];
            var nuevo_array;
            turno++;
            cargar(pantalla);
            switch (direccion) {


                case 'norte':
                    var nueva_posicion = posicion - 1;
                    console.log("Posicion :" + posicion + " " + nueva_posicion)
                    ARRAY_ACTUAL.splice(posicion, 1, texto);
                    if (ARRAY_ACTUAL[posicion - 1] == MANZANA ) {
                        generar_manzana();
                    }
                    if (nueva_posicion > -1) {
                        ARRAY_ACTUAL[posicion - 1] = prota;
                        posicion--;
                        cargar(pantalla);
                    } else {
                        terminar_juego();
                    }
                    break;


                case 'sur':
                    var nueva_posicion = posicion + 1;
                    console.log("Posicion :" + posicion + " " + nueva_posicion)
                    ARRAY_ACTUAL.splice(posicion, 1, texto);
                    if (ARRAY_ACTUAL[posicion + 1] == MANZANA ) {
                        generar_manzana();
                    }
                    if (nueva_posicion < ANCHO) {
                        ARRAY_ACTUAL[posicion + 1] = prota;
                        posicion++;
                        cargar(pantalla);
                    } else {
                        terminar_juego();
                    }
                    break;


                case 'este':
                    nuevo_array = posicion_array_actual - 1;
                    console.log("El array es :" + posicion_array_actual + " " + nuevo_array)
                    ARRAY_ACTUAL.splice(posicion, 1, texto);
                    if (nuevo_array < 0) {
                        terminar_juego(); 
                    } else {
                        pantalla[posicion_array_actual - 1][posicion] = prota;
                        pantalla[posicion_array_actual].splice(posicion, 1, texto);
                        posicion_array_actual--;
                        cargar();
                    }
                    if(nuevo_array > 0 && pantalla[posicion_array_actual - 1][posicion] == MANZANA ) {
                        generar_manzana();
                    }
                    break;


                case 'oeste':
                    nuevo_array = posicion_array_actual + 1;
                    console.log("El array es :" + posicion_array_actual + " " + nuevo_array)
                    ARRAY_ACTUAL.splice(posicion, 1, texto);
                    if (nuevo_array > FILAS - 1) {
                        terminar_juego(); 
                    } else {
                        pantalla[posicion_array_actual + 1][posicion] = prota;
                        pantalla[posicion_array_actual].splice(posicion, 1, texto);
                        posicion_array_actual++;
                        cargar();
                    }
                    if(nuevo_array < (FILAS - 1)  && pantalla[posicion_array_actual + 1][posicion] == MANZANA ) {
                        generar_manzana();
                    }
                    break;
            }
        }

        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    direccion = 'norte';
                    break;
                case 'ArrowDown':
                    direccion = 'sur';
                    break;
                case 'ArrowLeft':
                    direccion = 'este';
                    break;
                case 'ArrowRight':
                    direccion = 'oeste';
                    break;
            }
        });

        setInterval(mover, 200);


        cargar(pantalla);




    </script>
</body>

</html>
