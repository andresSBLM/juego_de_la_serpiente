<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de la serpiente con javascript</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main id="principal">

    </main>
    <script>
        const MAIN = document.getElementById("principal");
        const texto = '*';
        const prota = "0";
        var pantalla = [];
        const FILAS = 20;
        const ANCHO = 20;
        const POSICION_INICIO = 18;
        const ARRAY_INICIO = 10;
        var posicion = POSICION_INICIO;
        var turno = 0;
        var direccion = 'norte';
        var posicion_array_actual = ARRAY_INICIO;


        if (pantalla.length == 0) {
            for (let y = 0; y < FILAS; y++) {
                var array = [];
                for (let x = 1; x <= ANCHO; x++) {
                    array.push(texto);
                } 
                const P = document.createElement("p");
                pantalla.push(array);
                P.textContent = pantalla[y].join(" ");
                MAIN.appendChild(P);
            }
        }

        

        function cargar(array) {
            if (turno == 0) {
                const INICIO = array[posicion_array_actual];
                INICIO.splice(posicion, 1, prota);
                array[posicion_array_actual] = INICIO;
            }
            MAIN.innerHTML = '';
            for (let fila of pantalla) {
                const P = document.createElement("p");
                P.textContent = fila.join(" ");
                MAIN.appendChild(P);
            }
        }
        
    

        function comprobar()  {
            if (posicion == ANCHO) {
                terminar_juego();
            } else if((posicion + 1) == 0) {
                terminar_juego();
            } else if (posicion_array_actual == ANCHO - 1 || posicion_array_actual == 0) {
                terminar_juego();
            }
        }

        function terminar_juego() {
            alert("Has perdido");
            if (posicion != ANCHO) {
                pantalla[posicion_array_actual].splice(posicion, 1, texto);
            } else {
                pantalla[posicion_array_actual].splice(posicion, 1);
            }
            turno = 0;
            direccion = 'norte';
            posicion = POSICION_INICIO;
            posicion_array_actual = ARRAY_INICIO;
            cargar(pantalla);
        }

        function mover() {
            console.log(posicion_array_actual);
            turno++;
            cargar(pantalla);
            comprobar();
            switch (direccion) {
                case 'norte':
                    pantalla[posicion_array_actual].splice(posicion, 1, texto);
                    pantalla[posicion_array_actual][posicion - 1] = prota;
                    posicion--;
                    break;
                case 'sur':
                    pantalla[posicion_array_actual].splice(posicion, 1, texto);
                    pantalla[posicion_array_actual][posicion + 1] = prota;
                    posicion++;  
                    break;
                case 'este':
                    pantalla[posicion_array_actual].splice(posicion, 1, texto);
                    pantalla[posicion_array_actual - 1][posicion] = prota;
                    posicion_array_actual--;
                    break;
                case 'oeste':
                    pantalla[posicion_array_actual].splice(posicion, 1, texto);
                    pantalla[posicion_array_actual + 1][posicion] = prota;
                    posicion_array_actual++;
                    break;
            }
        }

        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    console.log("Arriba");
                    direccion = 'norte';
                    turno++;
                    break;
                case 'ArrowDown':
                    console.log("Abajo");
                    direccion = 'sur';
                    turno++;
                    break;
                case 'ArrowLeft':
                    console.log("Izquierda");
                    direccion = 'este';
                    turno++;
                    break;
                case 'ArrowRight':
                    console.log("Derecha");
                    direccion = 'oeste';
                    turno++;
                    break;
            }
        });

        setInterval(mover, 500);


        cargar(pantalla);



    </script>
</body>

</html>
